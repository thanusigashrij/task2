<!DOCTYPE html>
<html>

<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            width: 85%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .add-btn {
            display: inline-block;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
        }

        td {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f7f7f7;
        }

        .edit-btn {
            display: inline-block;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: bold;
            margin-right: 8px;
            transition: 0.3s;
        }

        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .delete-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🎓 Student Management System</h1>

        <a href="/add" class="add-btn">➕ Add Student</a>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>

            {% for student in students %}

            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ student[3] }}</td>

                <td>

                    <a href="/edit/{{ student[0] }}" class="edit-btn">
                        ✏ Edit
                    </a>

                    <a href="/delete/{{ student[0] }}" class="delete-btn"
                        onclick="return confirm('Delete this student?')">

                        🗑 Delete

                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
